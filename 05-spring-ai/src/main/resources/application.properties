spring.application.name=budgeting
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# CONFIGURAÇÕES DE BANCO DE DADOS (MySQL)
# ==========================================
# Conexão com o container Docker que iniciamos
spring.datasource.url=jdbc:mysql://localhost:3307/transaction
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURAÇÕES DO SPRING AI E GROQ
# ==========================================
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY}

# Configuração do Modelo do Chat
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
spring.ai.openai.chat.options.response-format.type=TEXT

# Configuração do Modelo de Transcrição
spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.options.model=whisper-large-v3
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro. Áudio contém descrição de gastos financeiros. As frases geralmente contêm: um valor em reais (número + "reais"); uma ação (gastei, paguei, comprei); um local ou estabelecimento (mercado, farmácia, restaurante, loja, etc.).

# Logs
logging.level.org.springframework.ai=DEBUG